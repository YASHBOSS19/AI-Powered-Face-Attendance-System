server {
    listen       80;
    server_name  localhost;

    # Serve static files and fallback to index.html for SPA routing
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Reverse proxy for backend API
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "http://backend:8000";
        
        # We rewrite /api/ to /api/ on the backend, or pass it directly.
        # Since Vite proxied /api/ -> /api/ (no rewrite), we can just pass it directly.
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for static files from backend
    location /static/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "http://backend:8000";
        
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy for WebSocket connections
    location /ws/ {
        resolver 127.0.0.11 valid=30s;
        set $backend "http://backend:8000";
        
        proxy_pass $backend;
        
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
